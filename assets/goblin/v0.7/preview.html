<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ECLIPSE Goblin V0.7 – Produktions-PNG-Prüfung</title><style>body{background:#1b2630;color:#f3f5f7;font:15px system-ui;padding:12px} .anim{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #51616a;padding:12px 0}.anim h2{width:80px;font-size:17px}canvas{image-rendering:pixelated;background:repeating-conic-gradient(#344553 0% 25%,#455867 0% 50%) 50%/16px 16px}.item{text-align:center}.item small{display:block;margin:4px}</style><h1>Goblin V0.7 – Original-PNGs</h1><p>Direkt aus frames/*.png geladen. 1x = 64 × 64 CSS-Pixel, 2x = 128 × 128 CSS-Pixel. Kein Smoothing. Die reale Spielgrösse ist durch die Hauptzentrale zu bestätigen.</p><main id="app"></main><script>const data=[['idle',4,180],['run',6,100],['attack',6,90],['hit',3,110],['death',5,150]];for(const [name,count,ms] of data){const row=document.createElement('section');row.className='anim';const title=document.createElement('h2');title.textContent=name;row.append(title);const imgs=Array.from({length:count},(_,i)=>{const img=new Image();img.src='frames/goblin_'+name+'_'+String(i).padStart(2,'0')+'.png';return img});const contexts=[];for(const scale of [1,2]){const wrap=document.createElement('div');wrap.className='item';const c=document.createElement('canvas');c.width=64*scale;c.height=64*scale;c.style.width=c.width+'px';c.style.height=c.height+'px';const caption=document.createElement('small');caption.textContent=scale+'x';wrap.append(c,caption);row.append(wrap);const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;contexts.push([ctx,c.width])}document.querySelector('#app').append(row);let k=0;function render(){const im=imgs[k];if(im.complete&&im.naturalWidth){for(const [ctx,size] of contexts){ctx.clearRect(0,0,size,size);ctx.drawImage(im,0,0,size,size)}}if(name!=='death'||k<count-1)k=(k+1)%count}render();setInterval(render,ms)}</script></html>
