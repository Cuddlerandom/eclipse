<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE Grasland – isolierte Vorschau</title><style>body{margin:0;background:#17251e;color:#e7dfbc;font:15px system-ui}header{padding:14px 20px}canvas{display:block;width:min(100%,960px);aspect-ratio:16/9;image-rendering:pixelated;margin:auto;border:3px solid #485640}p{max-width:960px;margin:14px auto;padding:0 12px}</style><header><b>ECLIPSE – Kapitel 1 Grasland</b> · isolierte Grafikvorschau</header><canvas id="preview" width="960" height="540"></canvas><p>Nur Grafik. Keine Hitboxen, Spielfigur, Gegner oder Gameplay. Asset-Verteilung ist ein visueller Platzhalter.</p><script src="../grassland.js"></script><script src="../grassland-decor.js"></script><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),grass=EclipseGrassland.createGrassland({quality:'high'}),decor=EclipseGrasslandDecor.createDecor({assetBase:'../../assets/grassland/'});let t=0;function frame(){t+=.016;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,960,540);const cx=190+Math.sin(t*.15)*60,cy=-110+Math.cos(t*.11)*30;ctx.save();ctx.translate(-cx,-cy);grass.render(ctx,cx,cy,960,540,t);decor.render(ctx,cx,cy,960,540);ctx.restore();requestAnimationFrame(frame)}frame();</script></html>
