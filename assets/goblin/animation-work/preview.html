<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE Goblin Animation Preview</title><style>body{background:#181e28;color:#eee;font:16px system-ui;padding:20px}canvas{image-rendering:pixelated;width:320px;height:320px;background:#303943}button,select{padding:8px;margin:6px}</style><h1>Goblin – Animationsprototyp</h1><p>Isolierte Vorschau, keine Gameplay-Integration.</p><select id="state"></select><button id="pause">Pause</button><p><canvas width="64" height="64"></canvas></p><output></output><script>const states={idle:[4,180,true],run:[6,100,true],attack:[6,90,false],hit:[3,110,false],death:[5,150,false]},s=document.querySelector('select'),ctx=document.querySelector('canvas').getContext('2d'),out=document.querySelector('output'),images={};ctx.imageSmoothingEnabled=false;let f=0,last=0,play=true;for(const k in states){s.add(new Option(k,k));images[k]=new Image();images[k].src='goblin_'+k+'.png'}s.onchange=()=>{f=0;last=0};document.querySelector('button').onclick=()=>{play=!play;document.querySelector('button').textContent=play?'Pause':'Weiter'};function tick(t){const k=s.value,[n,ms,loop]=states[k],im=images[k];if(!last)last=t;if(play&&t-last>=ms){f=loop?(f+1)%n:Math.min(n-1,f+1);last=t}ctx.clearRect(0,0,64,64);if(im.complete&&im.naturalWidth)ctx.drawImage(im,f*64,0,64,64,0,0,64,64);out.textContent=k+' '+(f+1)+'/'+n+' '+ms+'ms';requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
